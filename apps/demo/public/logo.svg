<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
	<title id="title">ExcaliburForm</title>
	<defs>
		<radialGradient id="bg" cx="0.5" cy="0.48" r="0.7">
			<stop offset="0" stop-color="#1d2a6e" />
			<stop offset="0.55" stop-color="#0e1640" />
			<stop offset="1" stop-color="#05081c" />
		</radialGradient>
		<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#ffe7a8" stop-opacity="0.55" />
			<stop offset="0.4" stop-color="#f5c35c" stop-opacity="0.18" />
			<stop offset="1" stop-color="#f5c35c" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff1bf" />
			<stop offset="0.45" stop-color="#e6b54a" />
			<stop offset="1" stop-color="#9c6a12" />
		</linearGradient>
		<linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#b9861f" />
			<stop offset="0.5" stop-color="#ffe9a6" />
			<stop offset="1" stop-color="#b9861f" />
