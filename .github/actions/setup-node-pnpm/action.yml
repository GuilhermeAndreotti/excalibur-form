name: Node + pnpm
description: Installs Node (version from .nvmrc), pnpm (version from packageManager) and the workspace dependencies.

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v4

        - uses: actions/setup-node@v4
          with:
              node-version-file: .nvmrc
              cache: pnpm

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
