name: Node + pnpm
description: Instala Node (versão do .nvmrc), pnpm (versão do packageManager) e as dependências do workspace.

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v4

        - uses: actions/setup-node@v4
          with:
              node-version-file: .nvmrc
              cache: pnpm

        - name: Instalar dependências
          shell: bash
          run: pnpm install --frozen-lockfile
